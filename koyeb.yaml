# Koyeb configuration
name: wa-status-scheduler
services:
  - name: web
    type: web
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 3000
        path: /
    regions:
      - sin # Singapore (closest to Indonesia)
    instance_type: nano
    scalings:
      min: 1
      max: 1
    env:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
